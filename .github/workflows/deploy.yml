name: Deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - staging
          - production
        default: production
      image_tag:
        description: Existing image tag to deploy (used for rollback)
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
  cancel-in-progress: false

permissions: {}

jobs:
  test-and-publish:
    name: Test and publish image
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/backend.yml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test-and-publish
    if: |
      always() &&
      (
        needs.test-and-publish.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')
      )
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: IMAGE_NAME,IMAGE_TAG,APP_DIR
          script: |
            set -eu
            cd "$APP_DIR"
            if [ -f .deployed-tag ]; then
              cp .deployed-tag .previous-tag
            fi
            export SYNCBOX_IMAGE="$IMAGE_NAME"
            export SYNCBOX_IMAGE_TAG="$IMAGE_TAG"
            docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
            docker compose --env-file .env up -d --remove-orphans
            docker compose exec -T app php artisan migrate --force --no-interaction
            printf '%s\n' "$IMAGE_TAG" > .deployed-tag
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}

  rollback:
    name: Rollback
    if: github.event_name == 'workflow_dispatch' && inputs.image_tag == ''
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Roll back to previous tag
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: APP_DIR,IMAGE_NAME
          script: |
            set -eu
            cd "$APP_DIR"
            if [ ! -f .previous-tag ]; then
              echo "No previous deployment tag is recorded on the server."
              exit 1
            fi
            PREVIOUS="$(cat .previous-tag)"
            export SYNCBOX_IMAGE="$IMAGE_NAME"
            export SYNCBOX_IMAGE_TAG="$PREVIOUS"
            docker pull "${IMAGE_NAME}:${PREVIOUS}"
            docker compose --env-file .env up -d --remove-orphans
            printf '%s\n' "$PREVIOUS" > .deployed-tag
        env:
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
